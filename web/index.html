<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexxle</title>
  <link rel="stylesheet" href="./pyscript/core.css">
  <link rel="stylesheet" href="./style.css">
  <script src="./storage.js"></script>
  <script type="module" src="./pyscript/core.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Hexxle</h1>
      <button id="show-puzzles" type="button" aria-expanded="false"
              aria-controls="puzzles" hidden>Puzzles</button>
    </header>
    <nav id="puzzles" aria-label="Puzzles" hidden></nav>
    <p id="notice" role="status"></p>
    <p id="title"></p>
    <p id="word" aria-live="polite"></p>
    <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Letter board"></svg>
    <p id="message" aria-live="polite"></p>
    <p id="progress"></p>
    <div id="found"></div>
  </main>
  <script type="mpy" src="./main.py" config="./pyscript.json"></script>
</body>
</html>
