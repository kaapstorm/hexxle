[project]
name = "hexxle"
version = "0.1.0"
description = "A hex-grid word puzzle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hexxle = "hexxle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexxle"]

[dependency-groups]
dev = [
    "playwright",
    "ruff",
    "testsweet",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "ANN"]
ignore = [
    "ANN002",  # missing annotation for *args
    "ANN003",  # missing annotation for **kwargs
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.format]
quote-style = "single"

[tool.testsweet.discovery]
include_paths = ["tests"]
