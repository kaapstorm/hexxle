name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python release that is still supported.
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: uv sync --locked
      # The pinned PyScript and MicroPython, which the site is built from.
      - run: npm ci
      # The browser tests drive Chromium, which needs system libraries.
      - run: uv run playwright install --with-deps chromium
      - run: uv run testsweet
